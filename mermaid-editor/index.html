<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MermaidFlow Studio - Canvas Infinito</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- App Workspace (Frameless Modern UI) -->
  <div class="workspace-wrapper">

    <!-- FLOATING TOP COMMAND DOCK (Figma / tldraw Style Floating Pill) -->
    <header class="floating-dock-top" id="floating-dock">
      
      <!-- Brand & Project -->
      <div class="dock-segment">
        <div class="brand-badge-icon" title="MermaidFlow Studio">⚡</div>
        <select id="select-template" class="dock-select-subtle" title="Cargar Plantilla">
          <option value="">📂 Plantillas...</option>
          <option value="auth">🔐 Autenticación JWT</option>
          <option value="pin_system">🏛️ Sistema Modular PIN (Subgrafos)</option>
          <option value="payment">💳 Pasarela de Pago</option>
          <option value="etl">📊 Pipeline ETL</option>
          <option value="blank">⬜ Lienzo Limpio</option>
        </select>
      </div>

      <div class="dock-divider"></div>

      <!-- History & Clear -->
      <div class="dock-segment">
        <button id="btn-undo" class="dock-icon-btn" title="Deshacer (Ctrl+Z)">↩</button>
        <button id="btn-redo" class="dock-icon-btn" title="Rehacer (Ctrl+Y)">↪</button>
        <button id="btn-clear" class="dock-icon-btn text-danger" title="Limpiar lienzo">🗑️</button>
      </div>

      <div class="dock-divider"></div>

      <!-- Shape buttons with inline SVG vector icons -->
      <div class="dock-segment">
        <div class="dock-buttons">
          <button class="dock-btn" data-shape="terminal" title="Inicio / Fin ([Texto])">
            <svg width="20" height="13" viewBox="0 0 24 14"><rect x="1" y="1" width="22" height="12" rx="6" fill="rgba(16,185,129,0.25)" stroke="#10b981" stroke-width="1.8"/></svg>
            <span>Inicio</span>
          </button>
          
          <button class="dock-btn" data-shape="process" title="Proceso [Texto]">
            <svg width="18" height="13" viewBox="0 0 24 14"><rect x="1" y="1" width="22" height="12" rx="2" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="1.8"/></svg>
            <span>Proceso</span>
          </button>
          
          <button class="dock-btn" data-shape="decision" title="Decisión / Rombo {¿Texto?}">
            <svg width="16" height="16" viewBox="0 0 24 24"><polygon points="12 2, 22 12, 12 22, 2 12" fill="rgba(245,158,11,0.25)" stroke="#f59e0b" stroke-width="1.8"/></svg>
            <span>Decisión</span>
          </button>
          
          <button class="dock-btn" data-shape="database" title="Base de Datos [(Texto)]">
            <svg width="16" height="16" viewBox="0 0 24 24">
              <path d="M4 6 C4 3 20 3 20 6 L20 18 C20 21 4 21 4 18 Z" fill="rgba(168,85,247,0.25)" stroke="#a855f7" stroke-width="1.6"/>
              <ellipse cx="12" cy="6" rx="8" ry="3" fill="none" stroke="#a855f7" stroke-width="1.6"/>
            </svg>
            <span>DB</span>
          </button>
          
          <button class="dock-btn" data-shape="io" title="Entrada / Salida [/Texto/]">
            <svg width="18" height="13" viewBox="0 0 24 14"><polygon points="5 1, 23 1, 19 13, 1 13" fill="rgba(6,182,212,0.25)" stroke="#06b6d4" stroke-width="1.8"/></svg>
            <span>E / S</span>
          </button>

          <button class="dock-btn" data-shape="subroutine" title="Subproceso [[Texto]]">
            <svg width="18" height="13" viewBox="0 0 24 14">
              <rect x="1" y="1" width="22" height="12" rx="2" fill="rgba(99,102,241,0.25)" stroke="#6366f1" stroke-width="1.8"/>
              <line x1="5" y1="1" x2="5" y2="13" stroke="#6366f1" stroke-width="1.5"/>
              <line x1="19" y1="1" x2="19" y2="13" stroke="#6366f1" stroke-width="1.5"/>
            </svg>
            <span>Sub</span>
          </button>
        </div>
      </div>

      <div class="dock-divider"></div>

      <!-- Color Palette -->
      <div class="dock-segment">
        <div class="color-palette">
          <button class="color-swatch active" data-color="emerald" style="--c:#10b981;" title="Esmeralda"></button>
          <button class="color-swatch" data-color="sky" style="--c:#0284c7;" title="Azul"></button>
          <button class="color-swatch" data-color="amber" style="--c:#f59e0b;" title="Ámbar"></button>
          <button class="color-swatch" data-color="purple" style="--c:#a855f7;" title="Púrpura"></button>
          <button class="color-swatch" data-color="rose" style="--c:#ef4444;" title="Rojo"></button>
          <button class="color-swatch" data-color="cyan" style="--c:#06b6d4;" title="Cian"></button>
          <button class="color-swatch" data-color="slate" style="--c:#64748b;" title="Gris"></button>
        </div>
      </div>

      <div class="dock-divider"></div>

      <!-- Connector & Direction -->
      <div class="dock-segment">
        <select id="select-conn-style" class="dock-select-subtle" title="Estilo de Flechas">
          <option value="curved">〰️ Curvas</option>
          <option value="orthogonal">📐 90°</option>
          <option value="straight">📏 Rectas</option>
        </select>

        <select id="select-direction" class="dock-select-subtle" title="Dirección del diagrama">
          <option value="TD">↓ TD</option>
          <option value="LR">→ LR</option>
          <option value="BT">↑ BT</option>
          <option value="RL">← RL</option>
        </select>

        <button id="btn-auto-layout" class="btn-dock-accent" title="Auto-Organizar nodos y subgrafos">
          <span>⚡ Organizar</span>
        </button>
      </div>

      <div class="dock-divider"></div>

      <!-- Export & Theme & Code Toggle -->
      <div class="dock-segment">
        <div class="export-dropdown-wrapper">
          <button id="btn-export-menu" class="dock-btn-outline" title="Exportar Diagrama">
            <span>💾 Exportar ▾</span>
          </button>
          <div class="export-dropdown" id="export-dropdown">
            <button id="btn-export-svg" class="dropdown-item">📐 Descargar Vector SVG</button>
            <button id="btn-export-png" class="dropdown-item">🖼️ Descargar Imagen PNG (HD)</button>
            <button id="btn-copy-svg" class="dropdown-item">📋 Copiar SVG al Portapapeles</button>
            <div class="dropdown-divider"></div>
            <button id="btn-download-mmd" class="dropdown-item">📝 Descargar Código .mmd</button>
          </div>
        </div>

        <button id="btn-theme-toggle" class="dock-icon-btn" title="Cambiar Tema Oscuro/Claro">🌓</button>

        <button id="btn-toggle-code" class="dock-btn-outline active" title="Mostrar/Ocultar Panel de Código">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          <span>Código</span>
        </button>

        <button id="btn-copy-mermaid" class="btn-copy-dock" title="Copiar código Mermaid al portapapeles">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span>Copiar</span>
        </button>
      </div>

    </header>

    <!-- CANVAS INTERACTIVO -->
    <main class="canvas-viewport" id="canvas-viewport">
      <div class="canvas-world" id="canvas-world">
        <!-- Subgraphs Container Layer (Background Containers) -->
        <div id="subgraphs-layer" class="subgraphs-layer"></div>

        <!-- SVG Connections Layer -->
        <svg id="svg-canvas" class="svg-canvas">
          <defs>
            <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
            </marker>
            <marker id="arrow-selected" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
            </marker>
          </defs>
          <g id="edges-layer"></g>
          <path id="temp-connecting-line" class="temp-connecting-line" style="display: none;"></path>
        </svg>

        <!-- HTML Nodes Layer -->
        <div id="nodes-layer" class="nodes-layer"></div>
      </div>

      <!-- Floating Node Inspector / Actions Bar -->
      <div class="node-floating-toolbar" id="node-floating-toolbar">
        <div id="node-branch-actions" class="toolbar-group"></div>
        <div class="toolbar-divider"></div>
        <button id="btn-node-edit" class="tool-btn" title="Editar texto (Doble clic)">✏️</button>
        <button id="btn-node-connect" class="tool-btn" title="Conectar con otro nodo">🔗</button>
        <button id="btn-node-delete" class="tool-btn text-danger" title="Eliminar nodo (Supr)">🗑️</button>
      </div>

      <!-- Multi-Selection Summary Toolbar -->
      <div class="multi-select-toolbar" id="multi-select-toolbar">
        <span id="multi-select-count">0 seleccionados</span>
        <div class="toolbar-divider"></div>
        <button id="btn-multi-delete" class="tool-btn text-danger" title="Eliminar seleccionados (Supr)">🗑️ Eliminar</button>
      </div>

      <!-- Floating Edge / Condition Popover -->
      <div class="edge-floating-popover" id="edge-floating-popover">
        <div class="popover-header">
          <span>Condición de la Flecha</span>
          <button id="btn-delete-edge-popover" class="btn-pop-del" title="Eliminar flecha">🗑️</button>
        </div>

        <div class="condition-chips">
          <button class="chip-btn chip-yes" data-val="Sí">🟢 Sí</button>
          <button class="chip-btn chip-no" data-val="No">🔴 No</button>
          <button class="chip-btn chip-ok" data-val="OK">🔵 OK</button>
          <button class="chip-btn chip-err" data-val="Error">🟠 Error</button>
          <button class="chip-btn chip-none" data-val="">⚪ Sin texto</button>
        </div>

        <div class="popover-row">
          <input type="text" id="edge-text-input" placeholder="O escribe texto libre..." spellcheck="false" />
        </div>

        <div class="popover-row">
          <select id="edge-style-picker">
            <option value="normal">Flecha Normal (-->)</option>
            <option value="thick">Flecha Gruesa (==>)</option>
            <option value="dotted">Línea Punteada (-.->)</option>
            <option value="open">Línea Simple (---)</option>
          </select>
        </div>
      </div>

      <!-- Connect Mode Indicator Banner -->
      <div class="connect-guide-banner" id="connect-guide-banner">
        <span>🔗 Haz clic en el nodo destino</span>
        <button id="btn-cancel-connection" class="btn-cancel-link">✕ Cancelar</button>
      </div>

      <!-- Bottom Canvas Navigation Hints & Zoom Controls -->
      <div class="canvas-navigation-hint">
        <span>💡 <b>Shift + Rueda:</b> Desplazamiento Horizontal | <b>Ctrl + Clic:</b> Selección Múltiple</span>
      </div>

      <div class="floating-zoom-controls">
        <button id="btn-zoom-out" class="zoom-btn" title="Alejar (−)">−</button>
        <span id="zoom-value" class="zoom-text">100%</span>
        <button id="btn-zoom-in" class="zoom-btn" title="Acercar (+)">+</button>
        <button id="btn-zoom-fit" class="zoom-btn" title="Centrar y Ajustar (⊞)">⊞</button>
      </div>
    </main>

    <!-- COLLAPSIBLE RIGHT SIDEBAR: BIDIRECTIONAL EDITABLE MERMAID CODE -->
    <aside class="sidebar-code" id="sidebar-code">
      <div class="code-panel-header">
        <div class="code-panel-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          <span>Editor de Código Mermaid</span>
        </div>
        <button id="btn-close-code-panel" class="btn-icon-close" title="Ocultar panel">✕</button>
      </div>

      <div class="code-panel-info-bar">
        <span>✍️ Escribe o pega código aquí para auto-estructurar el diagrama</span>
      </div>

      <div class="code-panel-body">
        <textarea id="mermaid-code-output" placeholder="Pega o escribe tu código Mermaid aquí..." spellcheck="false"></textarea>
      </div>

      <div class="code-panel-footer">
        <div class="code-stats">
          <span id="stat-nodes">0 nodos</span>
          <span id="stat-edges">0 conexiones</span>
          <span id="sync-status" class="sync-status">⚡ Sincronizado</span>
        </div>
        <div class="code-footer-actions">
          <button id="btn-apply-code" class="btn-apply-code" title="Parsear y auto-organizar en el lienzo">
            ⚡ Aplicar Código al Lienzo
          </button>
        </div>
      </div>
    </aside>

  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Main JavaScript App -->
  <script src="app.js"></script>
</body>
</html>
